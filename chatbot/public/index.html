<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Title (VERY IMPORTANT) -->
    <title>Custom Care – Secure AI Assistants for Customer Support & Knowledge</title>

    <!-- Primary Meta Description -->
    <meta
      name="description"
      content="Custom Care helps organizations create secure, private AI assistants powered by their own documents. Improve customer support, internal knowledge, and operational efficiency."
    />

    <!-- Keywords (light use, still okay) -->
    <meta
      name="keywords"
      content="AI assistant, customer support AI, knowledge base AI, enterprise chatbot, private AI, document based AI"
    />

    <!-- Brand / Theme -->
    <meta name="theme-color" content="#0B3C6D" />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Canonical URL (IMPORTANT for SEO later) -->
    <link rel="canonical" href="https://www.customcare.ai/" />

    <!-- Open Graph (for sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Custom Care – Secure AI Assistants for Organizations" />
    <meta
      property="og:description"
      content="Build private AI assistants using your company documents. Custom Care enables trusted AI-powered customer support and internal knowledge systems."
    />
    <meta property="og:url" content="https://www.customcare.ai/" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Custom Care – Secure AI Assistants" />
    <meta
      name="twitter:description"
      content="Create secure AI assistants for customer support and internal knowledge using your own documents."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts (optional but professional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <noscript>
      Custom Care requires JavaScript to run. Please enable JavaScript in your browser.
    </noscript>

    <div id="root"></div>
  </body>
</html>
