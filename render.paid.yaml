services:
  - name: adv-frontend
    type: web
    runtime: static
    rootDir: chatbot
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE_URL
        sync: false

  - name: adv-backend
    type: web
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DOC_SERVICE_BASE_URL
        sync: false
      - key: RAG_TIMEOUT_MS
        value: "120000"

  - name: adv-python-doc-service
    type: web
    runtime: docker
    rootDir: python_doc_service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /docs
    disk:
      name: python-doc-storage
      mountPath: /opt/app/storage
      sizeGB: 20
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SCRAPED_PDF_DIR
        value: /tmp/pdfs
      - key: AIRFLOW_AUTOTRIGGER_ENABLED
        value: "false"
      - key: ES_ENABLED
        value: "true"
      - key: ES_URLS
        sync: false
      - key: ES_API_KEY
        sync: false
      - key: ES_VERIFY_CERTS
        value: "true"
      - key: DVC_AUTO_FLOW_ENABLED
        value: "true"
      - key: DVC_AUTO_PUSH
        value: "true"
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MLFLOW_ENABLED
        value: "true"
      - key: MLFLOW_TRACKING_URI
        sync: false
      - key: MLFLOW_TRACKING_HOST
        fromService:
          type: pserv
          name: adv-mlflow
          property: host
      - key: MLFLOW_TRACKING_PORT
        fromService:
          type: pserv
          name: adv-mlflow
          property: port
      - key: AIRFLOW_API_BASE_URL
        sync: false
      - key: AIRFLOW_API_HOST
        fromService:
          type: pserv
          name: adv-airflow-api
          property: host
      - key: AIRFLOW_API_PORT
        fromService:
          type: pserv
          name: adv-airflow-api
          property: port
      - key: AIRFLOW_API_TOKEN
        sync: false
      - key: AIRFLOW_API_USERNAME
        sync: false
      - key: AIRFLOW_API_PASSWORD
        sync: false

  - name: adv-mlflow
    type: pserv
    runtime: docker
    rootDir: infra/airflow_mlflow_stack/mlflow
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "5000"
      - key: MLFLOW_DB_HOST
        fromDatabase:
          name: adv-mlflow-db
          property: host
      - key: MLFLOW_DB_PORT
        fromDatabase:
          name: adv-mlflow-db
          property: port
      - key: MLFLOW_DB_NAME
        fromDatabase:
          name: adv-mlflow-db
          property: database
      - key: MLFLOW_DB_USER
        fromDatabase:
          name: adv-mlflow-db
          property: user
      - key: MLFLOW_DB_PASSWORD
        fromDatabase:
          name: adv-mlflow-db
          property: password
      - key: MLFLOW_S3_BUCKET
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  - name: adv-airflow-api
    type: pserv
    runtime: docker
    rootDir: .
    dockerfilePath: ./infra/render/airflow/Dockerfile
    preDeployCommand: >-
      bash -lc 'export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:${AIRFLOW_DB_PORT}/${AIRFLOW_DB_NAME}" &&
      airflow db migrate &&
      (airflow users create --username "${AIRFLOW_ADMIN_USERNAME}" --firstname "Render" --lastname "Admin" --role "Admin" --email "${AIRFLOW_ADMIN_EMAIL}" --password "${AIRFLOW_ADMIN_PASSWORD}" || true)'
    dockerCommand: >-
      bash -lc 'export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:${AIRFLOW_DB_PORT}/${AIRFLOW_DB_NAME}" &&
      export AIRFLOW_ML_SERVICE_URL="http://${AIRFLOW_ML_SERVICE_HOST}:${AIRFLOW_ML_SERVICE_PORT}" &&
      airflow api-server --port "${PORT:-8080}"'
    envVars:
      - key: PORT
        value: "8080"
      - key: AIRFLOW_DB_HOST
        fromDatabase:
          name: adv-airflow-db
          property: host
      - key: AIRFLOW_DB_PORT
        fromDatabase:
          name: adv-airflow-db
          property: port
      - key: AIRFLOW_DB_NAME
        fromDatabase:
          name: adv-airflow-db
          property: database
      - key: AIRFLOW_DB_USER
        fromDatabase:
          name: adv-airflow-db
          property: user
      - key: AIRFLOW_DB_PASSWORD
        fromDatabase:
          name: adv-airflow-db
          property: password
      - key: AIRFLOW__CORE__EXECUTOR
        value: LocalExecutor
      - key: AIRFLOW__CORE__AUTH_MANAGER
        value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      - key: AIRFLOW__CORE__FERNET_KEY
        sync: false
      - key: AIRFLOW__CORE__LOAD_EXAMPLES
        value: "false"
      - key: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
        value: "true"
      - key: AIRFLOW_ADMIN_USERNAME
        sync: false
      - key: AIRFLOW_ADMIN_PASSWORD
        sync: false
      - key: AIRFLOW_ADMIN_EMAIL
        sync: false
      - key: AIRFLOW_ML_SERVICE_HOST
        fromService:
          type: web
          name: adv-python-doc-service
          property: host
      - key: AIRFLOW_ML_SERVICE_PORT
        fromService:
          type: web
          name: adv-python-doc-service
          property: port
      - key: AIRFLOW_ML_CLIENT_ID
        sync: false
      - key: AIRFLOW_ML_BOT_ID
        sync: false
      - key: AIRFLOW_HDBSCAN_REBUILD_MODE
        value: full
      - key: AIRFLOW_HDBSCAN_PDF_MANIFEST
        value: data/dvc/pdf_manifest.json
      - key: AIRFLOW_DEPLOY_CMD
        value: echo deploy_skipped

  - name: adv-airflow-scheduler
    type: worker
    runtime: docker
    rootDir: .
    dockerfilePath: ./infra/render/airflow/Dockerfile
    dockerCommand: >-
      bash -lc 'export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:${AIRFLOW_DB_PORT}/${AIRFLOW_DB_NAME}" &&
      export AIRFLOW__CORE__EXECUTION_API_SERVER_URL="http://${AIRFLOW_API_HOST}:${AIRFLOW_API_PORT}/execution/" &&
      export AIRFLOW_ML_SERVICE_URL="http://${AIRFLOW_ML_SERVICE_HOST}:${AIRFLOW_ML_SERVICE_PORT}" &&
      airflow scheduler'
    envVars:
      - key: AIRFLOW_DB_HOST
        fromDatabase:
          name: adv-airflow-db
          property: host
      - key: AIRFLOW_DB_PORT
        fromDatabase:
          name: adv-airflow-db
          property: port
      - key: AIRFLOW_DB_NAME
        fromDatabase:
          name: adv-airflow-db
          property: database
      - key: AIRFLOW_DB_USER
        fromDatabase:
          name: adv-airflow-db
          property: user
      - key: AIRFLOW_DB_PASSWORD
        fromDatabase:
          name: adv-airflow-db
          property: password
      - key: AIRFLOW_API_HOST
        fromService:
          type: pserv
          name: adv-airflow-api
          property: host
      - key: AIRFLOW_API_PORT
        fromService:
          type: pserv
          name: adv-airflow-api
          property: port
      - key: AIRFLOW_ML_SERVICE_HOST
        fromService:
          type: web
          name: adv-python-doc-service
          property: host
      - key: AIRFLOW_ML_SERVICE_PORT
        fromService:
          type: web
          name: adv-python-doc-service
          property: port
      - key: AIRFLOW__CORE__EXECUTOR
        value: LocalExecutor
      - key: AIRFLOW__CORE__AUTH_MANAGER
        value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      - key: AIRFLOW__CORE__FERNET_KEY
        sync: false
      - key: AIRFLOW__CORE__LOAD_EXAMPLES
        value: "false"
      - key: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
        value: "true"
      - key: AIRFLOW_ML_CLIENT_ID
        sync: false
      - key: AIRFLOW_ML_BOT_ID
        sync: false
      - key: AIRFLOW_HDBSCAN_REBUILD_MODE
        value: full
      - key: AIRFLOW_HDBSCAN_PDF_MANIFEST
        value: data/dvc/pdf_manifest.json
      - key: AIRFLOW_DEPLOY_CMD
        value: echo deploy_skipped

  - name: adv-airflow-dag-processor
    type: worker
    runtime: docker
    rootDir: .
    dockerfilePath: ./infra/render/airflow/Dockerfile
    dockerCommand: >-
      bash -lc 'export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:${AIRFLOW_DB_PORT}/${AIRFLOW_DB_NAME}" &&
      export AIRFLOW__CORE__EXECUTION_API_SERVER_URL="http://${AIRFLOW_API_HOST}:${AIRFLOW_API_PORT}/execution/" &&
      export AIRFLOW_ML_SERVICE_URL="http://${AIRFLOW_ML_SERVICE_HOST}:${AIRFLOW_ML_SERVICE_PORT}" &&
      airflow dag-processor'
    envVars:
      - key: AIRFLOW_DB_HOST
        fromDatabase:
          name: adv-airflow-db
          property: host
      - key: AIRFLOW_DB_PORT
        fromDatabase:
          name: adv-airflow-db
          property: port
      - key: AIRFLOW_DB_NAME
        fromDatabase:
          name: adv-airflow-db
          property: database
      - key: AIRFLOW_DB_USER
        fromDatabase:
          name: adv-airflow-db
          property: user
      - key: AIRFLOW_DB_PASSWORD
        fromDatabase:
          name: adv-airflow-db
          property: password
      - key: AIRFLOW_API_HOST
        fromService:
          type: pserv
          name: adv-airflow-api
          property: host
      - key: AIRFLOW_API_PORT
        fromService:
          type: pserv
          name: adv-airflow-api
          property: port
      - key: AIRFLOW_ML_SERVICE_HOST
        fromService:
          type: web
          name: adv-python-doc-service
          property: host
      - key: AIRFLOW_ML_SERVICE_PORT
        fromService:
          type: web
          name: adv-python-doc-service
          property: port
      - key: AIRFLOW__CORE__EXECUTOR
        value: LocalExecutor
      - key: AIRFLOW__CORE__AUTH_MANAGER
        value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      - key: AIRFLOW__CORE__FERNET_KEY
        sync: false
      - key: AIRFLOW__CORE__LOAD_EXAMPLES
        value: "false"
      - key: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
        value: "true"
      - key: AIRFLOW_ML_CLIENT_ID
        sync: false
      - key: AIRFLOW_ML_BOT_ID
        sync: false
      - key: AIRFLOW_HDBSCAN_REBUILD_MODE
        value: full
      - key: AIRFLOW_HDBSCAN_PDF_MANIFEST
        value: data/dvc/pdf_manifest.json
      - key: AIRFLOW_DEPLOY_CMD
        value: echo deploy_skipped

databases:
  - name: adv-airflow-db
    databaseName: airflow
    user: airflow

  - name: adv-mlflow-db
    databaseName: mlflow
    user: mlflow
