name: Autocomplete Model Flow

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: "Client ID"
        required: true
        type: string
      bot_id:
        description: "Bot ID"
        required: true
        type: string
  push:
    branches:
      - main
      - master
    paths:
      - "python_doc_service/app/autocomplete_training_pipeline.py"
      - "python_doc_service/app/pipeline/dvc_auto.py"
      - "python_doc_service/scripts/dvc/**"
      - "python_doc_service/dvc.yaml"
      - "python_doc_service/params.yaml"

jobs:
  autocomplete-train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_doc_service
    env:
      CLIENT_ID: ${{ github.event.inputs.client_id || vars.ML_CLIENT_ID || '' }}
      BOT_ID: ${{ github.event.inputs.bot_id || vars.ML_BOT_ID || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Inputs
        id: validate
        shell: bash
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$BOT_ID" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: CLIENT_ID/BOT_ID not configured."
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        if: steps.validate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dvc.txt

      - name: Init DVC
        if: steps.validate.outputs.should_run == 'true'
        run: python -m dvc init --no-scm -f

      - name: Set Dynamic DVC Params
        if: steps.validate.outputs.should_run == 'true'
        run: |
          python scripts/dvc/set_params.py \
            --client-id "$CLIENT_ID" \
            --bot-id "$BOT_ID"

      - name: Train Autocomplete
        if: steps.validate.outputs.should_run == 'true'
        run: |
          python scripts/dvc/run_autocomplete_train.py \
            --client-id "$CLIENT_ID" \
            --bot-id "$BOT_ID" \
            --wait \
            --force \
            --summary-out "storage/dvc_runs/client_${CLIENT_ID}/bot_${BOT_ID}/autocomplete_summary.json"

      - name: Track Autocomplete Artifacts
        if: steps.validate.outputs.should_run == 'true'
        run: python -m dvc repro autocomplete_track

      - name: Upload Autocomplete Summaries
        if: steps.validate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autocomplete-summaries
          path: |
            python_doc_service/storage/dvc_runs/client_${{ env.CLIENT_ID }}/bot_${{ env.BOT_ID }}/autocomplete_summary.json
            python_doc_service/storage/dvc_runs/client_${{ env.CLIENT_ID }}/bot_${{ env.BOT_ID }}/autocomplete_tracking.json
          if-no-files-found: warn
