name: HDBSCAN Model Flow

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: "Client ID"
        required: true
        type: string
      bot_id:
        description: "Bot ID"
        required: true
        type: string
      rebuild_mode:
        description: "Rebuild mode (full|incremental)"
        required: false
        default: "full"
        type: string
      pdf_manifest:
        description: "PDF manifest path"
        required: false
        default: "data/dvc/pdf_manifest.json"
        type: string
  push:
    branches:
      - main
      - master
    paths:
      - "python_doc_service/app/pipeline/**"
      - "python_doc_service/scripts/dvc/**"
      - "python_doc_service/data/dvc/pdf_manifest.json"
      - "python_doc_service/dvc.yaml"
      - "python_doc_service/params.yaml"

jobs:
  hdbscan-train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_doc_service
    env:
      CLIENT_ID: ${{ github.event.inputs.client_id || vars.ML_CLIENT_ID || '' }}
      BOT_ID: ${{ github.event.inputs.bot_id || vars.ML_BOT_ID || '' }}
      REBUILD_MODE: ${{ github.event.inputs.rebuild_mode || 'full' }}
      PDF_MANIFEST: ${{ github.event.inputs.pdf_manifest || 'data/dvc/pdf_manifest.json' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Inputs
        id: validate
        shell: bash
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$BOT_ID" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: CLIENT_ID/BOT_ID not configured."
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        if: steps.validate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dvc.txt

      - name: Init DVC
        if: steps.validate.outputs.should_run == 'true'
        run: python -m dvc init --no-scm -f

      - name: Set Dynamic DVC Params
        if: steps.validate.outputs.should_run == 'true'
        run: |
          python scripts/dvc/set_params.py \
            --client-id "$CLIENT_ID" \
            --bot-id "$BOT_ID" \
            --rebuild-mode "$REBUILD_MODE" \
            --pdf-manifest "$PDF_MANIFEST"

      - name: Run HDBSCAN Stage
        if: steps.validate.outputs.should_run == 'true'
        run: python -m dvc repro cluster_train

      - name: Upload Clustering Summary
        if: steps.validate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hdbscan-summary
          path: python_doc_service/storage/dvc_runs/client_${{ env.CLIENT_ID }}/bot_${{ env.BOT_ID }}/clustering_summary.json
          if-no-files-found: warn
