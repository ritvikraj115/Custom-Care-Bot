name: adv-project-stack

x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  AIRFLOW_ML_CLIENT_ID: ${AIRFLOW_ML_CLIENT_ID}
  AIRFLOW_ML_BOT_ID: ${AIRFLOW_ML_BOT_ID}
  AIRFLOW_ML_SERVICE_URL: ${AIRFLOW_ML_SERVICE_URL:-http://python-doc-service:8000}
  AIRFLOW_HDBSCAN_REBUILD_MODE: ${AIRFLOW_HDBSCAN_REBUILD_MODE}
  AIRFLOW_HDBSCAN_PDF_MANIFEST: ${AIRFLOW_HDBSCAN_PDF_MANIFEST}
  AIRFLOW_DEPLOY_CMD: ${AIRFLOW_DEPLOY_CMD}

x-airflow-common: &airflow-common
  image: apache/airflow:3.1.7
  environment:
    <<: *airflow-common-env
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ../../python_doc_service/airflow/dags:/opt/airflow/dags:ro
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy
    python-doc-service:
      condition: service_started

services:
  frontend:
    build:
      context: ../../chatbot
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: /api
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ../../server
      dockerfile: Dockerfile
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      DOC_SERVICE_BASE_URL: http://python-doc-service:8000
      RAG_TIMEOUT_MS: ${RAG_TIMEOUT_MS:-120000}
      DEBUG_RAG_PAYLOAD: ${DEBUG_RAG_PAYLOAD:-0}
      SOCIAL_REFRESH_INTERVAL_MS: ${SOCIAL_REFRESH_INTERVAL_MS:-21600000}
      SOCIAL_REFRESH_BATCH_LIMIT: ${SOCIAL_REFRESH_BATCH_LIMIT:-50}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    restart: unless-stopped
    depends_on:
      python-doc-service:
        condition: service_started

  python-doc-service:
    build:
      context: ../../python_doc_service
      dockerfile: Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.2}
      SCRAPED_PDF_DIR: /tmp/pdfs
      RUN_QUALITY_CHECKS: ${RUN_QUALITY_CHECKS:-false}
      SPACY_MODEL: ${SPACY_MODEL:-en_core_web_sm}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      EMBEDDING_NGRAM_MIN: ${EMBEDDING_NGRAM_MIN:-3}
      EMBEDDING_NGRAM_MAX: ${EMBEDDING_NGRAM_MAX:-5}
      ES_ENABLED: ${ES_ENABLED:-true}
      ES_URLS: ${ES_URLS}
      ES_API_KEY: ${ES_API_KEY}
      ES_VERIFY_CERTS: ${ES_VERIFY_CERTS:-true}
      ES_REQUEST_TIMEOUT_SEC: ${ES_REQUEST_TIMEOUT_SEC:-10}
      ES_PING_TIMEOUT_SEC: ${ES_PING_TIMEOUT_SEC:-3}
      ES_COOLDOWN_SECONDS: ${ES_COOLDOWN_SECONDS:-20}
      DVC_AUTO_FLOW_ENABLED: ${DVC_AUTO_FLOW_ENABLED:-true}
      DVC_AUTO_PUSH: ${DVC_AUTO_PUSH:-true}
      DVC_AUTO_TIMEOUT_SEC: ${DVC_AUTO_TIMEOUT_SEC:-900}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MLFLOW_ENABLED: ${MLFLOW_ENABLED:-true}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AIRFLOW_AUTOTRIGGER_ENABLED: ${AIRFLOW_AUTOTRIGGER_ENABLED:-true}
      AIRFLOW_API_BASE_URL: http://airflow-apiserver:8080
      AIRFLOW_API_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_AUTOCOMPLETE_DAG_ID: ${AIRFLOW_AUTOCOMPLETE_DAG_ID:-autocomplete_pipeline}
      AIRFLOW_HDBSCAN_DAG_ID: ${AIRFLOW_HDBSCAN_DAG_ID:-hdbscan_pipeline}
    ports:
      - "${PYTHON_DOC_PORT:-8000}:8000"
    restart: unless-stopped
    volumes:
      - python_doc_storage:/opt/app/storage
    depends_on:
      mlflow:
        condition: service_started

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD}
      POSTGRES_DB: ${POSTGRES_SUPERDB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d ${POSTGRES_SUPERDB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -lc
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME}" \
          --firstname "Admin" \
          --lastname "User" \
          --role "Admin" \
          --email "${AIRFLOW_ADMIN_EMAIL}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" || true
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    restart: unless-stopped
    ports:
      - "${AIRFLOW_WEB_PORT:-8091}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      python-doc-service:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      python-doc-service:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      python-doc-service:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully

  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MLFLOW_DB_HOST: postgres
      MLFLOW_DB_PORT: 5432
      MLFLOW_DB_USER: ${MLFLOW_DB_USER}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}
      MLFLOW_DB_NAME: ${MLFLOW_DB_NAME}
      MLFLOW_S3_BUCKET: ${MLFLOW_S3_BUCKET}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5000/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  python_doc_storage:
