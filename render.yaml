services:
  - name: adv-frontend
    type: web
    runtime: static
    rootDir: chatbot
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE_URL
        sync: false

  - name: adv-backend
    type: web
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DOC_SERVICE_BASE_URL
        sync: false
      - key: RAG_TIMEOUT_MS
        value: "120000"

  - name: adv-python-doc-service
    type: web
    runtime: docker
    plan: free
    rootDir: python_doc_service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /docs
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SCRAPED_PDF_DIR
        value: /tmp/pdfs
      - key: AIRFLOW_AUTOTRIGGER_ENABLED
        value: "false"
      - key: ES_ENABLED
        value: "true"
      - key: ES_URLS
        sync: false
      - key: ES_API_KEY
        sync: false
      - key: ES_VERIFY_CERTS
        value: "true"
      - key: DVC_AUTO_FLOW_ENABLED
        value: "false"
      - key: DVC_AUTO_PUSH
        value: "false"
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MLFLOW_ENABLED
        value: "false"
      - key: MLFLOW_TRACKING_URI
        sync: false
      - key: AIRFLOW_API_BASE_URL
        sync: false
      - key: AIRFLOW_API_TOKEN
        sync: false
      - key: AIRFLOW_API_USERNAME
        sync: false
      - key: AIRFLOW_API_PASSWORD
        sync: false
